<!DOCTYPE html>
<html lang="it" data-theme="dawn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chi Siamo — Aura Sacra</title>
  
  <meta name="google" content="notranslate">
  <link rel="icon" type="image/png" href="./icons/favicon.png">

  <!-- Tailwind CSS Locale -->
  <script src="./js/tailwindcss.js"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: ['class', '[data-theme="night"]'],
        theme: {
          extend: {
            colors: {
              parchment: { light: '#fdfbf7', base: '#f6efe2', dark: '#241b16', night: '#151519' },
              sacred: { gold: '#c69214', vermilion: '#b93b2c', blue: '#235789', amber: '#e5a93b' }
            },
            fontFamily: {
              serif: ['EB Garamond', 'Georgia', 'serif'],
              display: ['Cinzel', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif']
            }
          }
        }
      };
    }
  </script>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="antialiased selection:bg-amber-200 selection:text-amber-900 min-h-screen flex flex-col bg-[var(--bg-primary)] text-[var(--text-primary)]">

  <!-- NAVBAR CON RITORNO ALLA INDEX PRINCIPALE -->
  <header id="navbar-container" class="border-b border-[var(--border-color)] bg-[var(--bg-secondary)] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      
      <!-- Logo che torna all'Index principale -->
      <a href="./index.html" id="nav-brand" class="flex items-center gap-3">
        <img src="./icons/logo.png" alt="Aura Sacra Logo" width="40" height="40" class="w-9 h-9 rounded-xl object-cover shadow-sm border border-amber-600/40">
        <div>
          <span class="font-display font-bold text-lg tracking-wider block leading-none text-[var(--accent-vermilion)]">AURA SACRA</span>
          <span class="text-xs font-sans text-[var(--text-muted)]">Fossano • Sf. Iacob de Putna</span>
        </div>
      </a>

      <div class="flex items-center gap-2">
        <!-- Selettore rapido 9 lingue -->
        <select id="about-lang-select" class="px-2.5 py-1.5 rounded-lg border border-[var(--border-color)] bg-[var(--bg-card)] text-[var(--text-primary)] text-xs font-sans font-semibold cursor-pointer">
        </select>

        <!-- Pulsante per tornare alla Home -->
        <a href="./index.html" class="px-3 py-1.5 rounded-lg border border-[var(--border-color)] bg-[var(--bg-card)] text-xs font-sans hover:border-amber-600 transition-colors flex items-center gap-2">
          <i class="fa-solid fa-house text-[var(--accent-gold)]"></i>
          <span id="back-home-label">Home</span>
        </a>
      </div>

    </div>
  </header>

  <!-- CONTENUTO PRINCIPALE TRADOTTO IN 9 LINGUE -->
  <main id="about-main-container" class="flex-1 max-w-5xl w-full mx-auto px-4 py-6"></main>

  <!-- FOOTER -->
  <footer class="border-t border-[var(--border-color)] py-6 text-center text-xs text-[var(--text-muted)] bg-[var(--bg-secondary)] mt-auto">
    <p id="about-footer-text">&copy; Parrocchia Ortodossa Romena "San Giacomo di Putna" - Fossano | Pr. Nicolae Pușcașu</p>
    <p class="text-[var(--accent-gold)] font-display tracking-widest mt-1">☩ AURA SACRA ☩</p>
  </footer>

  <script type="module">
    import { initDB } from './js/db.js';
    import { initCircadianTheme } from './js/circadian.js';
    import { initI18n, getLanguage, setLanguage, onLanguageChange, SUPPORTED_LANGUAGES, t } from './js/i18n.js';
    import { renderAboutUs } from './js/components/about-us.js';

    async function initStandaloneAbout() {
      try { await initDB(); } catch (e) {}
      try { await initI18n(); } catch (e) {}
      try { await initCircadianTheme(); } catch (e) {}

      const mainEl = document.getElementById('about-main-container');
      const selectEl = document.getElementById('about-lang-select');
      const footerEl = document.getElementById('about-footer-text');

      function updateView() {
        const curLang = getLanguage();
        if (selectEl) {
          selectEl.innerHTML = SUPPORTED_LANGUAGES.map(
            l => `<option value="${l.code}" ${l.code === curLang ? 'selected' : ''}>${l.flag} ${l.nativeName}</option>`
          ).join('');
        }
        renderAboutUs(mainEl);
        document.title = `${t('about.title', 'About Us')} — Aura Sacra`;
        if (footerEl) {
          footerEl.textContent = `© ${t('about.subtitle', 'Romanian Orthodox Parish “Sfântul Iacob de Putna” – Fossano')} | ${t('about.priestName', 'Father Nicolae Pușcașu')}`;
        }
      }

      if (selectEl) {
        selectEl.addEventListener('change', async (e) => {
          await setLanguage(e.target.value);
        });
      }

      onLanguageChange(updateView);
      updateView();
    }

    initStandaloneAbout();
  </script>

</body>
</html>
