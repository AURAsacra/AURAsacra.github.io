<!DOCTYPE html>
<html lang="it" data-theme="dawn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Aura Sacra</title>

  <meta name="google" content="notranslate">
  <meta name="referrer" content="no-referrer">
  <link id="app-manifest" rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#c69214">

  <!-- Tailwind CSS Locale -->
  <script src="./js/tailwindcss.js"></script>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: ['class', '[data-theme="night"]'],
        theme: {
          extend: {
            colors: {
              parchment: { light: '#fdfbf7', base: '#f6efe2', dark: '#241b16', night: '#151519' },
              sacred: { gold: '#c69214', vermilion: '#b93b2c', blue: '#235789', amber: '#e5a93b' }
            },
            fontFamily: {
              serif: ['EB Garamond', 'Georgia', 'serif'],
              display: ['Cinzel', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif']
            }
          }
        }
      };
    }
  </script>

  <!-- FontAwesome & Stili Generali -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="antialiased selection:bg-amber-200 selection:text-amber-900 pb-32 sm:pb-28 md:pb-6">

  <div id="app" class="min-h-screen flex flex-col transition-colors duration-700">
    <header id="navbar-container"></header>

    <div class="flex-1 flex max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 gap-6">
      <aside id="sidebar-container" class="hidden md:block w-64 flex-shrink-0"></aside>
      <main id="main-content" class="flex-1 min-w-0 transition-opacity duration-300">
        <div id="initial-loading-skeleton" class="p-8 text-center space-y-4 max-w-md mx-auto my-16 bg-[var(--bg-card)] border-2 border-stone-200 dark:border-stone-800 rounded-2xl shadow-sm parchment-border animate-fade-in">
          <div class="w-12 h-12 mx-auto rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-700 dark:text-amber-300 font-bold text-2xl">✝</div>
          <h2 class="text-lg font-bold font-display text-[var(--accent-vermilion)] tracking-wider">AURA SACRA</h2>
          <p id="startup-loading-label" class="text-xs font-serif italic text-[var(--text-muted)]"></p>
        </div>
      </main>
    </div>

    <nav id="bottom-nav-container" class="md:hidden fixed z-40"></nav>
    <div id="floating-candle-container" class="hidden md:block"></div>
    <div id="audio-player-container"></div>
    <div id="modals-container"></div>
  </div>

  <!-- Global Startup & Error Handler -->
  <script>
    window.addEventListener('error', function (e) {
      console.error('Aura Sacra Error Caught:', e.error || e.message);
      const main = document.getElementById('main-content');
      if (main && (!main.innerHTML || main.innerHTML.trim() === '')) {
        main.innerHTML = `
          <div class="p-6 text-center space-y-4 max-w-lg mx-auto my-12 bg-amber-500/10 border-2 border-amber-600/40 rounded-2xl parchment-border">
            <h2 class="text-xl font-bold font-display text-[var(--accent-vermilion)]">Aura Sacra</h2>
            <p id="startup-error-label" class="text-sm font-serif text-[var(--text-secondary)]"></p>
            <button onclick="sessionStorage.clear(); caches.keys().then(k => Promise.all(k.map(c => caches.delete(c)))).then(() => location.reload(true));" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-md cursor-pointer transition">
              <span id="startup-reload-label"></span>
            </button>
          </div>
        `;
        const translate = window.AURA_SACRA_T || ((_key, fallback) => fallback);
        main.querySelector('#startup-error-label').textContent = translate('app.reloading', 'Reloading the platform...');
        main.querySelector('#startup-reload-label').textContent = translate('app.refreshCache', 'Refresh cache and restart');
      }
    });
  </script>

  <script type="module">
    import { initI18n, getLanguage, onLanguageChange, t } from './js/i18n.js';
    await initI18n();
    window.AURA_SACRA_T = t;
    const updateManifest = (language) => {
      document.getElementById('app-manifest').href = language === 'it' ? './manifest.json' : `./manifest-${language}.json`;
    };
    const updateDocumentTitle = () => {
      document.title = `Aura Sacra — ${t('nav.brandSub', 'Christian platform')}`;
    };
    updateManifest(getLanguage());
    updateDocumentTitle();
    onLanguageChange((language) => {
      updateManifest(language);
      updateDocumentTitle();
    });
    document.getElementById('startup-loading-label').textContent = t('app.starting', 'Starting Aura Sacra...');
  </script>

  <!-- Entry Point ES Module & Cross-Platform PWA Auto-Updater (iOS Safari, Android, Desktop) -->
  <script type="module" src="./js/app.js"></script>

  <script>
    (function () {
      const CURRENT_VERSION = 'aura-sacra-v1.9.7';
      let isReloading = false;

      function triggerSafeReload(incomingVersion) {
        if (isReloading) return;
        if (incomingVersion && incomingVersion === CURRENT_VERSION) return;
        // Avoid reload loops using sessionStorage guard (8 seconds cooldown)
        const lastReload = sessionStorage.getItem('aurasacra_sw_reload_ts');
        const now = Date.now();
        if (lastReload && now - Number(lastReload) < 8000) return;
        isReloading = true;
        sessionStorage.setItem('aurasacra_sw_reload_ts', String(now));
        window.location.reload();
      }

      // 1. Purge legacy versions only (never purge current version)
      if ('caches' in window) {
        caches.keys().then((keys) => {
          keys.forEach((k) => {
            if (k.startsWith('aura-sacra-v') && k !== CURRENT_VERSION) {
              console.log('Purging legacy cache:', k);
              caches.delete(k);
            }
          });
        }).catch(() => {});
      }

      // 2. Register & actively manage Service Worker across iOS Safari, Android, and Desktop
      if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
        // Reload automatically when a new Service Worker takes control
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          triggerSafeReload();
        });

        // Reload when the new Service Worker broadcasts SW_UPDATED
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_UPDATED' && event.data.version !== CURRENT_VERSION) {
            triggerSafeReload(event.data.version);
          }
        });

        window.addEventListener('load', () => {
          // updateViaCache: 'none' is critical on iOS Safari & Chrome so sw.js is never served from HTTP disk cache
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
            reg.update().catch(() => {});

            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });

            // Re-check for updates whenever iOS Home Screen Web App or mobile browser tab returns to foreground
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                reg.update().catch(() => {});
              }
            });

            window.addEventListener('pageshow', (e) => {
              if (e.persisted) {
                reg.update().catch(() => {});
              }
            });
          }).catch((err) => console.log('SW registration note:', err));
        });
      }
    })();
  </script>
</body>
</html>
